[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbepees-cl"
version = "0.1.0"
description = "Jurnal belajar 12 minggu membangun LLM dari awal + prototipe asisten BPS faktual & ber-sitasi."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aasa" }]
keywords = ["llm", "transformer", "education", "numpy", "pytorch", "rag"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
torch = ["torch>=2.2"]
vision = ["torch>=2.2", "torchvision>=0.17"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
rag = ["pypdf>=4"]
rag-embed = ["sentence-transformers>=3"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
